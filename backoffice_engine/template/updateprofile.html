{% extends "header_footer.html" %}
{% load static %}

{% block content %}

<!-- ====================================== Update Profile Section ===================================== -->

<section class="profile-section py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="profile-card p-4 shadow rounded">
                    <div class="text-center mb-4">
                        <img src="{% static 'assets/images/svg/user.svg' %}" alt="User Icon" class="mb-3" style="width: 80px;">
                        <h3>Update Profile</h3>
                    </div>
                    <hr>
                    
                    <form method="post" action="">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="name" class="form-label">name</label>
                            <input type="text" class="form-control" id="name" name="name" value="{{e.name}}" required>
                        </div>
                        <div class="mb-3">
                            <label for="mobile_number" class="form-label">Mobile Number</label>
                            <input type="text" class="form-control" id="mobile_number" name="mobile_number" value="{{e.mobile_number}}" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" value="{{e.password}}" required>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="/profile/" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-dark">Save Changes</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</section>

<!-- ====================================== Update Profile Section End ===================================== -->

{% endblock %}
