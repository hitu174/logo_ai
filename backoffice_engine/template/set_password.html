{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Reset Password | Logo AI</title>

   <link rel="icon" href="{% static 'assets/images/svg/favicon.svg' %}" type="image/x-icon">
   <link rel="stylesheet" href="{% static 'assets/css/swap.css' %}">
   <link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}">
   <link rel="stylesheet" href="{% static 'assets/css/style.css' %}">
   <link rel="stylesheet" href="{% static 'assets/css/media_query.css' %}">
</head>

<body>

   <!-- Header -->
   <div class="overlay" onclick="toggleMenu()"></div>
   <header id="top-navbar" class="top-navbar">
      <div class="container">
         <nav>
            <a href="index.html" class="logo">
               <img src="{% static 'assets/images/svg/logo.svg' %}" alt="logo">
            </a>
         </nav>
      </div>
   </header>

   <!-- Reset Password Section -->
   <section class="py-5">
      <div class="container">
         <div class="row justify-content-center">
            <div class="col-md-6">
               <div class="card p-4 shadow">
                  <h3 class="text-center mb-3">Reset Your Password</h3>
                  <p class="text-center text-muted">Enter the OTP sent to your email and set a new password.</p>

                  <form method="POST" action="/set_password/">
                     {% csrf_token %}
                     <div class="mb-3">
                        <label for="otp" class="form-label">Enter OTP</label>
                        <input type="text" name="otp" id="otp" class="form-control" required>
                     </div>

                     <div class="mb-3">
                        <label for="new_password" class="form-label">New Password</label>
                        <input type="password" name="new_password" id="new_password" class="form-control" required>
                     </div>

                     <div class="mb-3">
                        <label for="confirm_password" class="form-label">Confirm New Password</label>
                        <input type="password" name="confirm_password" id="confirm_password" class="form-control" required>
                     </div>

                     <div class="text-center mt-3">
                        <button type="submit" class="button w-100" style="background-color: #000; color: #fff;">Reset Password</button>
                     </div>

                     {% for message in messages %}
                        <div class="alert alert-info mt-3">{{ message }}</div>
                     {% endfor %}
                  </form>

                  <div class="mt-3 text-center">
                     <a href= "login/" class="text-decoration-none">Back to Login</a>
                  </div>
               </div>
            </div>
         </div>
      </div>
   </section>

   <!-- Scripts -->
   <script src="{% static 'assets/js/bootstrap.bundle.min.js' %}"></script>
   <script src="{% static 'assets/js/main.js' %}"></script>
</body>

</html>
