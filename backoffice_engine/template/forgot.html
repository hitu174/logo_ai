{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Forgot Password | Logo AI</title>

   <link rel="icon" type="image/x-icon" href="{% static 'assets/images/svg/favicon.svg' %}">
   <link rel="stylesheet" href="{% static 'assets/css/swap.css' %}">
   <link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}">
   <link rel="stylesheet" href="{% static 'assets/css/style.css' %}">
   <link rel="stylesheet" href="{% static 'assets/css/media_query.css' %}">
</head>

<body>
   <div class="overlay" onclick="toggleMenu()"></div>
   <header id="top-navbar" class="top-navbar">
      <div class="container">
         <nav>
            <a href="/index/" class="logo">
               <img src="{% static 'assets/images/svg/logo.svg' %}" alt="logo">
            </a>
         </nav>
      </div>
   </header>

   <section class="py-5">
      <div class="container">
         <div class="row justify-content-center">
            <div class="col-md-6">
               <div class="card p-4 shadow">
                  <h3 class="text-center mb-3">Forgot Password</h3>
                  <p class="text-center text-muted">Enter your email to receive an OTP to reset your password.</p>

                  <form method="POST" action="" class="mt-3">
                     {% csrf_token %}
                     <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
                     </div>
                     <div class="text-center">
                         <button type="submit" class="button w-100" style="background-color: #000; color: #fff;">Send OTP</button>
                     </div>
                     {% for message in messages %}
                        <div class="alert alert-info mt-2">{{ message }}</div>
                     {% endfor %}
                  </form>

                  <div class="mt-3 text-center">
                     <a href="/login/" class="text-decoration-none">Back to Login</a>
                  </div>
               </div>
            </div>
         </div>
      </div>
   </section>

   <script src="{% static 'assets/js/bootstrap.bundle.min.js' %}"></script>
   <script src="{% static 'assets/js/main.js' %}"></script>
</body>
</html>
